services:
  - type: web
    name: bluemind-web-service-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.3
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: bluemind_web_service
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_TO
        value: admin@xn--bluemndwebservice-gvc.com
      - key: EMAIL_FROM
        value: BlueMind Web Service <notifications@xn--bluemndwebservice-gvc.com>
